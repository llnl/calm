[pytest]
addopts = -ra
pythonpath =
    .
filterwarnings =
    error
markers =
    smoke: smoke tests for examples (fast, minimal runtime)
    public: supported public API contract tests
    examples: runnable user example tests and artifact checks
    arch: static architecture, import-boundary, and retired-surface guardrails
    repository: repository layout, prose, packaging, and policy consistency checks
    unit: focused implementation-unit tests
    integration: tests spanning persistence, orchestration, or external backends
    slab: slab, surface, and primitive surface-cell algorithm tests
    interface: interface enumeration, strain, build, registry, and energy-kernel tests
    project: project/workspace persistence and transaction tests
    calculators: calculator registry and provider tests
    real_backend: opt-in tests that require ASE and real calculator backends

testpaths =
    tests
