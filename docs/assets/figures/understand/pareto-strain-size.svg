<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1440 780" data-calm-figure-version="2">
<title id="title">Search-wide strain-size Pareto selection</title>
<desc id="desc">A chart of interface atom count versus cell mismatch shows candidates A, B, and D on the nondominated Pareto front. Candidate C is dominated by B because B is both smaller and lower mismatch. A lower-left dominance region and the ranking-after-membership sequence are shown.</desc>
<style>
  .canvas { fill: #fcfdff; }
  .panel { fill: #f5f7fb; stroke: #cbd3e1; stroke-width: 1.6; }
  .panel-white { fill: #ffffff; stroke: #cbd3e1; stroke-width: 1.6; }
  .panel-a { fill: #e0f2f0; stroke: #007c78; stroke-width: 2; }
  .panel-b { fill: #e8eefb; stroke: #3563c4; stroke-width: 2; }
  .panel-violet { fill: #efeafb; stroke: #6c4ccf; stroke-width: 2; }
  .panel-amber { fill: #faead8; stroke: #c97619; stroke-width: 2; }
  .panel-red { fill: #f8e6e4; stroke: #b34e45; stroke-width: 2; }
  .ink { stroke: #172033; stroke-width: 2.2; fill: none; }
  .line { stroke: #536078; stroke-width: 1.8; fill: none; }
  .line-heavy { stroke: #172033; stroke-width: 3; fill: none; }
  .line-a { stroke: #007c78; stroke-width: 3; fill: none; }
  .line-b { stroke: #3563c4; stroke-width: 3; fill: none; }
  .line-violet { stroke: #6c4ccf; stroke-width: 3; fill: none; }
  .line-amber { stroke: #c97619; stroke-width: 3; fill: none; }
  .line-red { stroke: #b34e45; stroke-width: 3; fill: none; }
  .line-muted { stroke: #aab4c4; stroke-width: 1.3; fill: none; }
  .dash { stroke-dasharray: 9 7; }
  .dot { stroke-dasharray: 3 6; }
  .grid { stroke: #dce2ec; stroke-width: 1; }
  .grid-strong { stroke: #bdc7d7; stroke-width: 1.4; }
  .atom-a { fill: #ffffff; stroke: #007c78; stroke-width: 2.2; }
  .atom-b { fill: #ffffff; stroke: #3563c4; stroke-width: 2.2; }
  .atom-neutral { fill: #ffffff; stroke: #637087; stroke-width: 1.8; }
  .point-front { fill: #ffffff; stroke: #007c78; stroke-width: 3; }
  .point-dominated { fill: #ffffff; stroke: #b34e45; stroke-width: 3; }
  .point-selected { fill: #6c4ccf; stroke: #ffffff; stroke-width: 2; }
  .fill-a { fill: #62b9b4; fill-opacity: 0.34; stroke: #007c78; stroke-width: 2.4; }
  .fill-b { fill: #7f9ddd; fill-opacity: 0.28; stroke: #3563c4; stroke-width: 2.4; }
  .fill-violet { fill: #9e86df; fill-opacity: 0.25; stroke: #6c4ccf; stroke-width: 2.4; }
  .fill-amber { fill: #e5a153; fill-opacity: 0.28; stroke: #c97619; stroke-width: 2.4; }
  .fill-red { fill: #d88881; fill-opacity: 0.22; stroke: #b34e45; stroke-width: 2.4; }
  .surface-plane { fill: #e5a153; fill-opacity: 0.34; stroke: #c97619; stroke-width: 2.2; }
  .vacuum { fill: url(#vacuum-hatch); stroke: #aab4c4; stroke-width: 1.4; }
  .badge { fill: #ffffff; stroke: #bdc7d7; stroke-width: 1.4; }
  .title { font: 700 28px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #172033; letter-spacing: -0.25px; }
  .panel-title { font: 700 19px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #172033; }
  .label { font: 650 16px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #172033; }
  .body { font: 15.5px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #38445a; }
  .small { font: 13.5px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #5c677b; }
  .tiny { font: 12px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #68748a; }
  .math { font: italic 17px Cambria, Georgia, 'Times New Roman', serif; fill: #172033; }
  .math-small { font: italic 14px Cambria, Georgia, 'Times New Roman', serif; fill: #38445a; }
  .step { font: 700 14px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #ffffff; }
  .white { fill: #ffffff; }
  .a-text { fill: #006e6a; }
  .b-text { fill: #2d55aa; }
  .violet-text { fill: #5f40b8; }
  .amber-text { fill: #a95d10; }
  .red-text { fill: #963d36; }
</style>
<defs>

  <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#172033"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#536078"/></marker>
  <marker id="arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#007c78"/></marker>
  <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#3563c4"/></marker>
  <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6c4ccf"/></marker>
  <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c97619"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#b34e45"/></marker>
  <pattern id="vacuum-hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#f8fafc"/><line x1="0" y1="0" x2="0" y2="12" stroke="#dce2ec" stroke-width="3"/></pattern>
  <pattern id="dominated-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f8e6e4" fill-opacity="0.55"/><line x1="0" y1="0" x2="0" y2="10" stroke="#d88881" stroke-width="2"/></pattern>


</defs>
<rect class="canvas" width="1440" height="780" rx="24"/>
<text x="56" y="52" class="title">Pareto membership preserves every nondominated size–mismatch compromise</text>
<rect x="44" y="92" width="980" height="620" rx="16" class="panel" />
<rect x="1052" y="92" width="344" height="620" rx="16" class="panel-white" />
<line x1="130" y1="625" x2="130" y2="195" class="grid"/>
<line x1="294" y1="625" x2="294" y2="195" class="grid"/>
<line x1="458" y1="625" x2="458" y2="195" class="grid"/>
<line x1="622" y1="625" x2="622" y2="195" class="grid"/>
<line x1="786" y1="625" x2="786" y2="195" class="grid"/>
<line x1="950" y1="625" x2="950" y2="195" class="grid"/>
<line x1="130" y1="625" x2="950" y2="625" class="grid"/>
<line x1="130" y1="539" x2="950" y2="539" class="grid"/>
<line x1="130" y1="453" x2="950" y2="453" class="grid"/>
<line x1="130" y1="367" x2="950" y2="367" class="grid"/>
<line x1="130" y1="281" x2="950" y2="281" class="grid"/>
<line x1="130" y1="195" x2="950" y2="195" class="grid"/>
<line x1="130" y1="625" x2="970" y2="625" class="line-heavy" marker-end="url(#arrow-ink)"/>
<line x1="130" y1="625" x2="130" y2="175" class="line-heavy" marker-end="url(#arrow-ink)"/>
<text x="540" y="682" class="label" text-anchor="middle">interface atom count → larger model</text>
<text x="75" y="410" class="label" text-anchor="middle" transform="rotate(-90 75 410.0)">cell mismatch d_cell</text>
<text x="118" y="186" class="small" text-anchor="end">lower</text>
<text x="118" y="205" class="small" text-anchor="end">is better</text>
<text x="208" y="660" class="small" text-anchor="middle">80</text>
<text x="402" y="660" class="small" text-anchor="middle">100</text>
<text x="596" y="660" class="small" text-anchor="middle">120</text>
<text x="790" y="660" class="small" text-anchor="middle">140</text>
<text x="118" y="200" class="small" text-anchor="end">0.060</text>
<text x="118" y="307" class="small" text-anchor="end">0.045</text>
<text x="118" y="415" class="small" text-anchor="end">0.030</text>
<text x="118" y="522" class="small" text-anchor="end">0.015</text>
<text x="118" y="630" class="small" text-anchor="end">0.000</text>
<path d="M 435 430 H 950 V 195 H 435 Z" fill="url(#dominated-hatch)" opacity="0.42"/>
<text x="760" y="235" class="small red-text" text-anchor="middle">region dominated by B</text>
<path d="M 260 260 Q 340 350 435 430 Q 640 515 865 555" class="line-a" />
<line x1="435" y1="430" x2="610" y2="430" class="line-red dash" marker-end="url(#arrow-red)"/>
<line x1="610" y1="430" x2="610" y2="360" class="line-red dash" marker-end="url(#arrow-red)"/>
<text x="525" y="458" class="small red-text" text-anchor="middle">larger</text>
<text x="628" y="398" class="small red-text" text-anchor="middle" transform="rotate(-90 628 398)">higher mismatch</text>
<circle cx="260" cy="260" r="10" class="point-front" />
<text x="260" y="240" class="label a-text" text-anchor="middle">A</text>
<circle cx="435" cy="430" r="10" class="point-front" />
<text x="435" y="410" class="label a-text" text-anchor="middle">B</text>
<circle cx="865" cy="555" r="10" class="point-front" />
<text x="865" y="535" class="label a-text" text-anchor="middle">D</text>
<circle cx="610" cy="360" r="10" class="point-dominated" />
<text x="610" y="340" class="label red-text" text-anchor="middle">C</text>
<text x="650" y="585" class="label a-text" text-anchor="middle">search-wide Pareto front</text>
<text x="1080" y="136" class="panel-title">Selection order</text>
<circle cx="1090" cy="190" r="18" class="" fill="#3563c4" stroke="none"/>
<text x="1090" y="195" class="step" text-anchor="middle">1</text>
<text x="1125" y="188" class="label">finite candidate set</text>
<text x="1125" y="212" class="small">exact search bounds</text>
<line x1="1090" y1="214" x2="1090" y2="280" class="line-muted" marker-end="url(#arrow-muted)"/>
<circle cx="1090" cy="315" r="18" class="" fill="#007c78" stroke="none"/>
<text x="1090" y="320" class="step" text-anchor="middle">2</text>
<text x="1125" y="313" class="label">Pareto membership</text>
<text x="1125" y="337" class="small">remove dominated C</text>
<line x1="1090" y1="339" x2="1090" y2="405" class="line-muted" marker-end="url(#arrow-muted)"/>
<circle cx="1090" cy="440" r="18" class="" fill="#6c4ccf" stroke="none"/>
<text x="1090" y="445" class="step" text-anchor="middle">3</text>
<text x="1125" y="438" class="label">ranking / truncation</text>
<text x="1125" y="462" class="small">applied only afterward</text>
<rect x="1078" y="565" width="292" height="110" rx="14" class="panel-amber" />
<text x="1098" y="594" class="label amber-text">What the front does not rank</text>
<text x="1098" y="622" class="small">elastic energy · interface energy</text>
<text x="1098" y="646" class="small">chemistry · registry · termination</text>
</svg>
