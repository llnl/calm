<text x="1146" y="635" class="math-small" text-anchor="middle">E_A^rel + E_B^rel − E_int</text>
<text x="1146" y="663" class="label" text-anchor="middle">divide by A × n_int</text>
<text x="720" y="742" class="body" text-anchor="middle">Raw total energies are saved separately; the convention determines the derived thermodynamic quantity.</text>
