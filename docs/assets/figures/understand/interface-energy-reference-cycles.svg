<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1440 780" data-calm-figure-version="2">
<title id="title">Three interfacial energy reference processes</title>
<desc id="desc">A central coherent interface is connected to three distinct reference states: coherently strained bulks, cleaved unrelaxed surfaces, and independently relaxed fixed-cell surfaces. Each path answers a different scientific question and uses area and interface multiplicity normalization.</desc>
