<text x="244" y="635" class="math-small" text-anchor="middle">E_int − m_A μ_A − m_B μ_B</text>
<text x="244" y="663" class="label" text-anchor="middle">divide by A × n_int</text>
<rect x="495" y="390" width="400" height="300" rx="16" class="panel-amber" />
