<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1440 780" data-calm-figure-version="2">
<title id="title">Calculator-free first-interface workflow</title>
<desc id="desc">Seven connected stages show packaged LiF and Li2O structures becoming saved materials, explicit surfaces, a bounded coherent-interface search, one selected candidate, a built interface, and exported files. A lower band states that no calculator is required and that the result is constructed but unrelaxed.</desc>
<style>
