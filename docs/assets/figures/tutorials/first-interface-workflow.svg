<text x="126" y="586" class="label a-text">No calculator</text>
<text x="126" y="616" class="small">search and construction</text>
<text x="126" y="642" class="small">use geometry only</text>
<text x="430" y="586" class="label violet-text">Saved lineage</text>
<text x="430" y="616" class="small">the project can be reopened</text>
<text x="430" y="642" class="small">and continued</text>
