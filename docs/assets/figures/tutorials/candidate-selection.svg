<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1440 780" data-calm-figure-version="2">
<title id="title">Candidate filtering and Pareto selection</title>
<desc id="desc">An illustrative scatter plot compares interface candidates by estimated atom count and cell mismatch. Four nondominated Pareto points form a descending front. Three points also satisfy the tutorial strain threshold and become a shortlist. A side panel emphasizes that the shortlist still requires a modeling decision.</desc>
<style>
