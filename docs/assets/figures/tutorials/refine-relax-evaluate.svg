<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1440 780" data-calm-figure-version="2">
<title id="title">Refine, relax, and evaluate workflow</title>
<desc id="desc">A built Cu/Ni interface passes through strain-partition and registry refinement, then fixed-cell relaxation. Raw interface energy and independently relaxed fixed-cell surface reference energies feed an explicit work-of-adhesion equation divided by interface area and interface multiplicity. Every calculator-backed stage is marked as a local model-dependent calculation.</desc>
<style>
