<text x="1170" y="470" class="panel-title violet-text" text-anchor="middle">work of adhesion</text>
<text x="1170" y="520" class="math-small" text-anchor="middle">W_ad = (E_A^rel + E_B^rel − E_int)</text>
<line x1="1082" y1="535" x2="1258" y2="535" class="line-heavy"/>
<text x="1170" y="566" class="math-small" text-anchor="middle">n_int A</text>
