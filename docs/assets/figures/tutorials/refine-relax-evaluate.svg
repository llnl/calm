<line x1="882" y1="532" x2="994" y2="532" class="line-violet" marker-end="url(#arrow-violet)"/>
<text x="720" y="664" class="body" text-anchor="middle">Refinement, relaxation, raw energies, and the derived quantity remain separate inspectable results.</text>
