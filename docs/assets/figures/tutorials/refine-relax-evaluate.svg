<rect class="canvas" width="1440" height="780" rx="24"/>
<text x="56" y="54" class="title">Calculator-backed stages add energetic evidence in explicit layers</text>
<text x="56" y="82" class="body">ASE EMT demonstrates workflow mechanics; each result remains conditional on the model, starting structure, settings, and reference process.</text>
